<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      color: white;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      padding: 50px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .avatar {
      width: 120px;
      height: 120px;
      background: white;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      color: #4facfe;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .btn {
      padding: 12px 25px;
      background: white;
      color: #4facfe;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">🚀</div>
    <h1>你好，我是 ZiYo！</h1>
    <p>这是我自己搭建的第一个网站 ✨</p>
 <button class="btn">点我有惊喜</button>
  </div>

  <script>
    const btn = document.querySelector('.btn')
    btn.addEventListener('click', () => {
      alert('恭喜！你的网站已经升级完成啦！')
    })
  </script>
</body>
</html>
